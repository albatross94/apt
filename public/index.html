<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 실거래가 및 공시가격 조회</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/report.js"></script>
<style>
:root{--color-bg:#ffffff;--color-fg:#1d2330;--color-fg-muted:#5f6878;--color-panel:#f6f7f9;--color-border-line:#dde1e8;--color-bad:#c0392b;
--cds-font-size-title:1.75rem;--cds-font-size-heading:1.0625rem;--cds-font-size-body:.9375rem;--cds-font-size-caption:.8125rem;--cds-font-weight-medium:600;
--cds-gap-xs:.35rem;--cds-gap-sm:.6rem;--cds-gap-md:1rem;--cds-gap-lg:1.5rem;--cds-pad-xs:.3rem;--cds-pad-sm:.6rem;--cds-pad-lg:1.1rem;--cds-radius:10px;
--cds-chart-grid:#e6e9ef;--cds-chart-muted:#b7bdc9;--cds-chart-axis:#aab1bf;--cds-surface-popover:#ffffff;--cds-border:#c9cfda;--cds-shadow-popover:0 4px 14px rgba(20,30,50,.15);--cds-text-secondary:#5f6878;
--font-sans:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
--c0:#2a5bd7;--c1:#d9531e;--c2:#1c8c6e;--c3:#8a4fd1;--c4:#c29a0d;--c5:#0e8aa8;--c6:#c2417a;--c7:#6b7280;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--color-bg:#14171d;--color-fg:#e8ebf1;--color-fg-muted:#9aa3b2;--color-panel:#1c2028;--color-border-line:#2c323d;--color-bad:#ef6b5c;
--cds-chart-grid:#2a303a;--cds-chart-muted:#4d5666;--cds-chart-axis:#566072;--cds-surface-popover:#262b35;--cds-border:#3a4150;--cds-shadow-popover:0 4px 14px rgba(0,0,0,.5);--cds-text-secondary:#9aa3b2;
--c0:#6f9bff;--c1:#ff8a57;--c2:#4fc9a4;--c3:#b793f2;--c4:#e6c24a;--c5:#4cc3dd;--c6:#f07aa8;--c7:#9aa3b2;color-scheme:dark}}
[hidden]{display:none!important}
html,body{margin:0}body{background:var(--color-bg);color:var(--color-fg);font-family:var(--font-sans);font-size:var(--cds-font-size-body);line-height:1.5}
.wrap{padding:max(16px,3vw)}
@media print{.gx-tablewrap{max-height:none;overflow:visible}.gx-card,.gx-tile{break-inside:avoid}.gx-ctrl{display:none}}
.gx-page{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--cds-gap-lg);font-variant-numeric:tabular-nums}
.gx-head h1{font-weight:400;font-size:var(--cds-font-size-title);margin:0;text-wrap:balance}
.gx-head p{margin:var(--cds-gap-xs) 0 0;color:var(--color-fg-muted)}
.gx-card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);display:flex;flex-direction:column;gap:var(--cds-gap-sm);min-width:0}
.gx-card h2{margin:0;font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium)}
.gx-note{margin:0;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.gx-ctrl{display:flex;flex-direction:column;gap:.8rem}
.gx-row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.gx-ctrl label{display:flex;flex-direction:column;gap:.25rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.gx-ctrl select{font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--cds-border);border-radius:8px;padding:.4rem .6rem;min-width:9rem}
.gx-ctrl select:disabled{opacity:.55}
.gx-ctrl button{font:inherit;padding:.45rem 1.2rem;border-radius:8px;border:1px solid var(--color-fg);background:var(--color-fg);color:var(--color-bg);cursor:pointer;font-weight:var(--cds-font-weight-medium)}
.gx-ctrl button:disabled{opacity:.5;cursor:wait}
.gx-ctrl button.sec{background:transparent;color:var(--color-fg)}
#status{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
#status.err{color:var(--color-bad)}
.gx-chips{display:flex;flex-wrap:wrap;gap:var(--cds-gap-xs)}
.gx-chips button{font:inherit;font-size:var(--cds-font-size-caption);display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border:1px solid var(--color-border-line);border-radius:999px;background:transparent;color:var(--color-fg-muted);cursor:pointer}
.gx-chips button i{width:.65rem;height:.65rem;border-radius:50%;display:inline-block;opacity:.35}
.gx-chips button[aria-pressed="true"]{color:var(--color-fg);border-color:var(--cds-border);background:var(--color-bg);font-weight:var(--cds-font-weight-medium)}
.gx-chips button[aria-pressed="true"] i{opacity:1}
.gx-legend{display:flex;flex-wrap:wrap;gap:var(--cds-gap-xs) var(--cds-gap-md);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.gx-legend span{display:inline-flex;align-items:center;gap:.35rem}
.gx-legend i{width:.7rem;height:.7rem;border-radius:2px;display:inline-block}
.gx-plot{position:relative}
.gx-chart{min-height:18rem}.gx-chart.gx-short{min-height:14rem}
.gx-chart svg{display:block;max-width:100%}.gx-chart svg text{font-family:var(--font-sans)}
.gx-tip{position:absolute;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);border-radius:var(--cds-radius);box-shadow:var(--cds-shadow-popover);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);white-space:nowrap;display:none;z-index:2}
.gx-tip div:first-child{color:var(--cds-text-secondary)}
.gx-tablewrap{max-height:26rem;overflow:auto}
.gx-table{width:100%;border-collapse:collapse}
.gx-table th{position:sticky;top:0;background:var(--color-panel);text-align:right;font-weight:var(--cds-font-weight-medium);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);padding:.4rem .6rem;border-bottom:1px solid var(--color-border-line)}
.gx-table td{text-align:right;padding:.4rem .6rem;border-bottom:1px solid var(--color-border-line)}
.gx-table th:first-child,.gx-table td:first-child,.gx-table th:nth-child(2),.gx-table td:nth-child(2){text-align:left}
.gx-head h1.gx-title{font-size:2rem;font-weight:700;color:var(--c0)}
.gx-note.err{color:var(--color-bad)}
.gx-foot{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);margin:0}
.gx-empty{color:var(--color-fg-muted);padding:2rem 0;text-align:center}
.gx-ctrl input{font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--cds-border);border-radius:8px;padding:.4rem .6rem;min-width:8rem;max-width:100%}
.gx-badge{display:inline-block;font-size:.72rem;line-height:1.3;padding:0 .4rem;margin-left:.35rem;border-radius:999px;border:1px solid var(--color-bad);color:var(--color-bad);white-space:nowrap}
.gx-kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.35rem 1rem;margin:0;font-size:var(--cds-font-size-caption)}
.gx-kv dt{color:var(--color-fg-muted)}.gx-kv dd{margin:0;word-break:keep-all}
.gx-warn{color:var(--color-bad)}
.gx-table td.l,.gx-table th.l{text-align:left}
.gx-sech{font-size:var(--cds-font-size-title);font-weight:400;margin:var(--cds-gap-lg) 0 0}
.gx-bul{margin:0;padding-left:1.2rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);display:flex;flex-direction:column;gap:.2rem}
.gx-rsub{margin:.4rem 0 0;font-size:var(--cds-font-size-body);font-weight:var(--cds-font-weight-medium)}
.gx-rblk{display:flex;flex-direction:column;gap:var(--cds-gap-sm)}
@media print{.gx-ctrl{display:none}.gx-card{break-inside:avoid}.gx-tablewrap{max-height:none;overflow:visible}}
.gx-col{display:flex;flex-direction:column;gap:var(--cds-gap-lg)}
#dash>.gx-page{width:100%}
.gx-pill{font:inherit;font-size:var(--cds-font-size-caption);padding:.3rem .7rem;border:1px solid var(--cds-border);border-radius:999px;background:var(--color-bg);color:var(--color-fg);cursor:pointer;font-weight:var(--cds-font-weight-medium)}
.gx-areas{display:flex;flex-wrap:wrap;gap:.6rem}
.gx-areas button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:.1rem;padding:.55rem .9rem;min-width:9.5rem;border:1px solid var(--color-border-line);border-radius:10px;background:var(--color-bg);color:var(--color-fg);cursor:pointer}
.gx-areas button b{font-weight:400;font-size:1.05rem}
.gx-areas button small{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.gx-areas button[aria-pressed="true"]{border:2px solid var(--color-fg);padding:calc(.55rem - 1px) calc(.9rem - 1px)}
.gx-areas button[aria-pressed="true"] b,.gx-areas button[aria-pressed="true"] small{font-weight:var(--cds-font-weight-medium);color:var(--color-fg)}
.gx-seg{display:inline-flex;flex-wrap:wrap;gap:.25rem;padding:.3rem;border-radius:12px;background:var(--color-border-line);align-self:flex-start}
.gx-seg button{font:inherit;font-weight:var(--cds-font-weight-medium);padding:.55rem 1.2rem;border:0;border-radius:9px;background:transparent;color:var(--color-fg-muted);cursor:pointer}
.gx-seg button[aria-pressed="true"]{background:var(--color-bg);color:var(--color-fg);box-shadow:0 1px 3px rgba(20,30,50,.12)}
.gx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:var(--cds-gap-md) var(--cds-gap-lg)}
.gx-stat{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.gx-stat .k{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.gx-stat .v{font-size:1.6rem;font-weight:700;line-height:1.25}
.gx-stat .s{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.gx-warnbox{background:#fff3dc;border:1px solid #f0d49a;color:#7a4b00;border-radius:8px;padding:.65rem .9rem;font-size:var(--cds-font-size-caption)}
@media (prefers-color-scheme:dark){.gx-warnbox{background:#3a2e12;border-color:#6b5420;color:#f1d28a}}
.gx-table.num th:nth-child(2),.gx-table.num td:nth-child(2){text-align:right}
.gx-legend button{font:inherit;color:inherit;display:inline-flex;align-items:center;gap:.35rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:.2rem .5rem;cursor:pointer}
.gx-legend button:hover{border-color:var(--cds-border)}
.gx-legend button[aria-pressed="true"]{background:var(--color-bg);border-color:var(--color-fg)}
.gx-legend.sel button[aria-pressed="false"]{opacity:.45}
#gs-tbl th{cursor:pointer;user-select:none}
.gx-table.num th,.gx-table.num td{text-align:right}
.gx-table.num th:first-child,.gx-table.num td:first-child{text-align:left}
/* 분석리포트 양식(A4 794x1123px). 화면 밖에 만들어 두고 이미지로 찍어 PDF에 넣는다 */
.rpt-stage{position:absolute;left:-10000px;top:0;width:794px}
.pg{width:794px;height:1123px;background:#e6d9ce;color:#202227;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;line-height:normal}
.pg,.pg *{box-sizing:border-box}
@media print{.rpt-stage{display:none}}
#pdf-dlg fieldset{border:1px solid var(--color-border-line);border-radius:8px;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.35rem;margin:0}
#pdf-dlg legend{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);padding:0 .3rem}
.gx-login{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gx-login form{width:min(22rem,100%);gap:var(--cds-gap-sm)}
.gx-login input{font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--cds-border);border-radius:8px;padding:.5rem .7rem}
.gx-login button{font:inherit;padding:.55rem 1.2rem;border-radius:8px;border:1px solid var(--color-fg);background:var(--color-fg);color:var(--color-bg);cursor:pointer;font-weight:var(--cds-font-weight-medium)}
.gx-login button:disabled{opacity:.5;cursor:wait}
.gx-pdf{font:inherit;align-self:flex-start;padding:.55rem 1.2rem;border-radius:9px;border:1px solid var(--color-fg);background:transparent;color:var(--color-fg);cursor:pointer;font-weight:var(--cds-font-weight-medium)}
.gx-printonly{display:none;margin:0;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
#pdf-dlg{border:1px solid var(--cds-border);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);padding:var(--cds-pad-lg);max-width:min(24rem,calc(100vw - 2rem));font-family:var(--font-sans)}
#pdf-dlg::backdrop{background:rgba(0,0,0,.4)}
#pdf-dlg form{display:flex;flex-direction:column;gap:var(--cds-gap-sm)}
#pdf-dlg h2{margin:0;font-size:var(--cds-font-size-heading)}
#pdf-dlg input{font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--cds-border);border-radius:8px;padding:.45rem .6rem}
#pdf-dlg .gx-row{justify-content:flex-end}
#pdf-dlg button{font:inherit;padding:.45rem 1.2rem;border-radius:8px;border:1px solid var(--color-fg);background:var(--color-fg);color:var(--color-bg);cursor:pointer;font-weight:var(--cds-font-weight-medium)}
#pdf-dlg button.sec{background:transparent;color:var(--color-fg)}
/* 인쇄(PDF)는 항상 밝은 색으로. 조회 조건·탭·버튼은 빼고, 선택 상자는 어떤 값을 골랐는지 보이도록 남긴다 */
/* 브라우저가 붙이는 머리글·바닥글(날짜, 파일명)은 @page 여백을 0으로 두면 나오지 않는다.
   대신 쪽마다 위아래 여백이 있도록, 반복되는 머리·바닥 표 그룹(.pf-h/.pf-f)에 빈 칸을 둔다 */
@page{margin:0;size:A4 portrait}
@media print{
  /* 쪽 배치: 카드·그래프·표 한 줄은 쪽 경계에서 잘리지 않게 하고, 제목은 다음 내용과 붙여 둔다 */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}   /* 색 점·범례 색·카드 배경이 PDF에 나오도록 */
  .gx-page,.gx-col{gap:.7rem}
  .gx-card{break-inside:avoid;padding:.8rem 1rem;box-shadow:none}
  #gs-card{break-inside:auto}   /* 공시가격 표는 길어서 쪽을 넘겨 이어 나오게 한다 */
  .gx-plot,.gx-stats,.gx-legend,.gx-areas,.gx-kv,.gx-warnbox,.gx-chips{break-inside:avoid}
  h1,h2,h3,.gx-rsub{break-after:avoid}
  .gx-table thead{display:table-header-group}   /* 표가 쪽을 넘어가면 머리글 반복 */
  .gx-table tr{break-inside:avoid}
  .gx-stat .v{font-size:1.3rem}
  .gx-head h1{font-size:1.6rem}
  .gx-chart{min-height:0}
  .wrap{padding:0 14mm}
  .pf{display:table;width:100%}
  .pf-h{display:table-header-group}.pf-b{display:table-row-group}.pf-f{display:table-footer-group}
  .pf .sp{height:12mm}
  :root{--color-bg:#ffffff;--color-fg:#1d2330;--color-fg-muted:#5f6878;--color-panel:#f6f7f9;--color-border-line:#dde1e8;--color-bad:#c0392b;
    --cds-chart-grid:#e6e9ef;--cds-chart-axis:#aab1bf;--cds-border:#c9cfda;--cds-text-secondary:#5f6878;
    --c0:#2a5bd7;--c1:#d9531e;--c2:#1c8c6e;--c3:#8a4fd1;--c4:#c29a0d;--c5:#0e8aa8;--c6:#c2417a;--c7:#6b7280;color-scheme:light}
  .no-print,#tabs,.gx-pdf,.gx-ctrl button,#gs-status{display:none!important}
  .gx-ctrl{display:flex}
  .gx-printonly{display:block}
  .gx-warnbox{background:#fff3dc;border-color:#f0d49a;color:#7a4b00}
}
.gx-eyebrow{margin:0;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);font-weight:var(--cds-font-weight-medium)}
</style></head>
<body><div class="wrap">
<div id="login" class="gx-login" hidden>
  <form id="login-form" class="gx-card">
    <h2>로그인</h2>
    <label class="gx-note" for="login-pw">비밀번호</label>
    <input id="login-pw" type="password" autocomplete="current-password" required>
    <p id="login-err" class="gx-note err" role="alert"></p>
    <button type="submit" id="login-go">로그인</button>
  </form>
</div>
<div class="pf"><div class="pf-h"><div class="sp"></div></div><div class="pf-b">
<div class="gx-page" id="app" hidden>

  <section class="gx-card gx-ctrl no-print" aria-label="조회 조건">
    <div class="gx-row">
      <label>시군구<select id="region"></select></label>
      <label>거래 종류<select id="kind" style="min-width:6rem"><option value="sale">매매</option><option value="jeonse">전세</option><option value="wolse">월세</option></select></label>
    </div>
    <div class="gx-row">
      <label>시작월<select id="from"></select></label>
      <label>종료월<select id="to"></select></label>
      <button id="go">조회</button><span id="status"></span>
      <button type="button" class="sec" id="logout" hidden style="margin-left:auto">로그아웃</button>
    </div>
    <div class="gx-row">
      <label>아파트명<select id="apt" disabled style="min-width:20rem"><option>조회 후 선택</option></select></label>
    </div>
  </section>

  <div id="dash" hidden>
    <div class="gx-page">
      <header class="gx-head" id="top">
        <p class="gx-eyebrow">국토교통부 실거래가 공개자료 기반 분석 리포트</p>
        <h1 id="h-title"></h1>
        <p id="print-meta" class="gx-printonly"></p>
        <p id="h-sub"></p>
      </header>

      <section class="gx-card">
        <h2 id="pick-h">전용면적 선택</h2>
        <p class="gx-note" id="pick-note">면적마다 가격대가 다르므로, 같은 면적끼리만 비교해서 보여 드립니다.</p>
        <div class="gx-areas" id="chips-pick" role="group" aria-label="전용면적 선택"></div>
        <div class="gx-seg" id="tabs" role="group" aria-label="거래 종류">
          <button type="button" data-k="sale">매수인용 · 매매</button>
          <button type="button" data-k="jeonse">임차인용 · 전세</button>
          <button type="button" data-k="wolse">임차인용 · 월세</button>
          <button type="button" data-k="gongsi">공시가격</button>
          <button type="button" data-k="cmp">단지비교</button>
        </div>
        <button type="button" class="gx-pdf" id="pdf-btn">이 탭 PDF로 저장</button>
      </section>

      <div class="gx-col" id="tab-body"></div>

      <section class="gx-card" id="gs-card" hidden>
        <h2>동·호별 공시가격</h2>
        <p class="gx-note">국토교통부 공동주택가격(V-World) 자료입니다. 공시기준일은 매년 1월 1일이고, 필지(지번) 단위로 조회하므로 한 필지에 단지가 여러 개면 함께 나옵니다.</p>
        <div class="gx-ctrl"><div class="gx-row"><button type="button" id="gs-load">공시가격 조회</button><span id="gs-status" class="gx-note"></span></div></div>
        <div id="gs-body" class="gx-col" hidden>
          <div class="gx-ctrl"><div class="gx-row">
            <label>기준연도<select id="gs-year"></select></label>
            <label>동<select id="gs-dong"></select></label>

        <h2>이 자료를 믿고 보실 수 있는 근거</h2>

<script>
/* ---------- 로그인 (공용 비밀번호, 서버가 세션 쿠키 발급) ---------- */
// 로그인이 필요 없는 설정(APP_PASSWORD 없음)이면 바로 앱을 보여 준다. 첫 화면에서는 확인이 끝나기 전까지 아무것도 보이지 않는다.
const showApp = (authed, required) => {
  document.getElementById('login').hidden = authed;
  document.getElementById('app').hidden = !authed;
  document.getElementById('logout').hidden = !(authed && required);
  if (!authed) document.getElementById('login-pw').focus();
};
// 세션이 끝난 뒤 데이터 요청이 401로 오면 로그인 화면으로 돌아간다
const rawFetch = window.fetch.bind(window);
window.fetch = async (...a) => {
  const r = await rawFetch(...a);
  if (r.status === 401 && String(a[0]).startsWith('/api/') && !/^\/api\/(login|me)/.test(String(a[0]))) showApp(false, true);
  return r;
};
rawFetch('/api/me').then((r) => r.json()).then((j) => showApp(j.authed, j.required))
  .catch(() => showApp(true, false));   // 서버가 응답하지 않아도 화면은 열어 두고, 데이터 요청에서 오류가 나게 한다
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-go'), err = document.getElementById('login-err'), pw = document.getElementById('login-pw');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await rawFetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '로그인하지 못했습니다.');
    pw.value = ''; showApp(true, true);
  } catch (ex) { err.textContent = ex.message; pw.select(); }
  btn.disabled = false;
};
document.getElementById('logout').onclick = async () => {
  await rawFetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.reload();   // 화면에 남은 조회 결과를 지우기 위해 새로 고친다
};

const PY = 3.3058;
const $ = (id) => document.getElementById(id);
const q = (s) => document.querySelector(s);
const fmt = d3.format(',');
const eok = (v) => d3.format('.1f')(v / 10000);
const won = (v) => { const e = Math.floor(v / 10000), m = Math.round(v % 10000); return (e ? e + '억 ' : '') + (m ? fmt(m) + '만' : '') + '원'; };
const col = (i) => `var(--c${i % 8})`;
const pyeong = (a) => Math.round(a / PY);

// 매매는 거래가, 전세·월세는 보증금(price)을 기준으로 집계한다. 월세는 rent(만원/월)를 따로 보여준다.
const KINDS = { sale: { name: '매매', price: '거래가' }, jeonse: { name: '전세', price: '보증금' }, wolse: { name: '월세', price: '보증금' } };
const kindOf = (k) => KINDS[k] || KINDS.sale;
const state = { tab: 'sale', regions: [], raw: [], rawAll: [], from: '', to: '', lawd: '', data: null, areas: [], pick: null, band: null, cont: null, ask: { sale: {}, jeonse: {}, wolse: {} }, apt: null, aptKey: null, loadInfo: null };
const LOW = 3;   // 이 건수 미만이면 "표본 적음"
const med = (a) => (a.length ? d3.median(a, (r) => r.price) : null);

/* ---------- 조회 조건 ---------- */
const sel = $('region');
fetch('/regions.json').then((r) => r.json()).then((list) => {
  state.regions = list;
  const groups = new Map();
  for (const r of list) (groups.get(r.sido) || groups.set(r.sido, []).get(r.sido)).push(r);
  for (const [sido, items] of groups) {
    const og = document.createElement('optgroup'); og.label = sido;
    for (const r of items) og.append(new Option(`${r.name} (${r.code})`, r.code));
    sel.append(og);
  }
  sel.value = '41115'; // 수원시 팔달구
});

const now = new Date();
const ym = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
for (let i = 0; i < 120; i++) {
  const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
  const label = `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
  $('from').append(new Option(label, ym(d)));
  $('to').append(new Option(label, ym(d)));
}
$('to').value = ym(now);
$('from').value = ym(new Date(now.getFullYear() - 1, now.getMonth(), 1));

$('go').onclick = async () => {
  const btn = $('go'), st = $('status');
  btn.disabled = true; st.className = '';
  st.textContent = '불러오는 중… (처음엔 기간에 따라 수십 초 걸릴 수 있습니다)';
  try {
    const from = $('from').value, to = $('to').value;
    if (from > to) throw new Error('시작월이 종료월보다 늦습니다.');
    const kind = $('kind').value;
    const trades = await loadTrades(sel.value, from, to, (d, n) => { st.textContent = `불러오는 중… ${d}/${n}개월`; }, kind);
    state.from = from; state.to = to; state.lawd = sel.value; state.tab = kind;
    state.rawAll = trades;
    state.loadInfo = { at: new Date(), months: monthsInRange(from, to).length, canceled: trades.filter((t) => t.canceled).length };
    state.raw = trades.filter((t) => !t.canceled);
    kindCache.clear(); kindCache.set([kind, state.lawd, from, to].join('|'), Promise.resolve(state.raw));
    st.textContent = `${kindOf(kind).name} 거래 ${state.raw.length.toLocaleString()}건` + (kind === 'sale' ? ' (해제 제외)' : '');
    buildAptOptions();
  } catch (e) { st.className = 'err'; st.textContent = e.message; }
  btn.disabled = false;
};

const aptKey = (t) => t.dong + '|' + t.apt;


function buildAptOptions() {
  const cnt = new Map();
  for (const t of state.raw) {
    const k = aptKey(t);
    (cnt.get(k) || cnt.set(k, { n: 0, apt: t.apt, dong: t.dong }).get(k)).n++;
  }
  const el = $('apt');
  el.innerHTML = '';
  const list = [...cnt].sort((a, b) => b[1].n - a[1].n || a[1].apt.localeCompare(b[1].apt, 'ko'));
  if (!list.length) {
    el.append(new Option('거래 없음', '')); el.disabled = true;
    state.data = null; $('dash').hidden = true; return;
  }
  for (const [k, o] of list) el.append(new Option(`${o.apt} · ${o.dong} (${o.n}건)`, k));
  el.disabled = false;
  el.value = list[0][0];
  selectApt();
}
$('apt').onchange = selectApt;

const prepTrades = (raw, key) => raw.filter((t) => aptKey(t) === key).map((t) => ({
  ...t, ym: t.date.slice(0, 7), year: +t.date.slice(0, 4), month: +t.date.slice(5, 7), day: +t.date.slice(8, 10),
}));

const ymLabel = (s) => `${s.slice(0, 4)}년 ${+s.slice(4)}월`;

/* ---------- 차트 공통 ---------- */
function tip(el, lines, x, y) {
  const t = el.parentNode.querySelector('.gx-tip');
  t.replaceChildren(...lines.map((s) => { const d = document.createElement('div'); d.textContent = s; return d; }));
  t.style.display = 'block';
  const w = t.offsetWidth, W = el.parentNode.clientWidth;
  t.style.left = Math.max(0, Math.min(W - w, x + 12)) + 'px';
  t.style.top = Math.max(0, y - 44) + 'px';
}
const hideTip = (el) => { el.parentNode.querySelector('.gx-tip').style.display = 'none'; };
function axisStyle(g) {
  g.attr('font-size', null).attr('font-family', null);
  g.selectAll('text').style('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)');
  g.selectAll('line,path').style('stroke', 'var(--cds-chart-axis)');
}
function legend(el, items) {
  el.replaceChildren(...items.map((it) => {
    const s = document.createElement('span'), i = document.createElement('i');
    i.style.background = it.color; s.append(i, document.createTextNode(it.name)); return s;
  }));
}

const monthsInRange = (from = state.from, to = state.to) => {
  const out = []; let y = +from.slice(0, 4), m = +from.slice(4);
  const ey = +to.slice(0, 4), em = +to.slice(4);
  while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${String(m).padStart(2, '0')}`); if (++m > 12) { m = 1; y++; } }
  return out;
};


/* ---------- 공통 DOM 도우미 ---------- */
const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
function mkTable(head, rows, left = [0]) {
  const t = mk('table', null, 'gx-table'), tr0 = mk('tr');
  head.forEach((h, i) => tr0.append(mk('th', h, left.includes(i) ? 'l' : '')));
  t.append(mk('thead')); t.firstChild.append(tr0);
  const tb = mk('tbody');
  for (const r of rows) {
    const tr = mk('tr');
    r.forEach((c, i) => { const td = mk('td', null, left.includes(i) ? 'l' : ''); if (c instanceof Node) td.append(c); else td.textContent = c; tr.append(td); });
    tb.append(tr);
  }
  t.append(tb);
  const w = mk('div', null, 'gx-tablewrap'); w.append(t); return w;
}
function mkKv(pairs) {
  const d = mk('dl', null, 'gx-kv');
  for (const [k, v] of pairs) { d.append(mk('dt', k)); const dd = mk('dd'); if (v instanceof Node) dd.append(v); else dd.textContent = v; d.append(dd); }
  return d;
}
const dstr = (d) => `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
const dtstr = (d) => `${dstr(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const regionLabel = () => { const r = state.regions.find((x) => x.code === state.lawd) || { sido: '', name: '' }; return `${r.sido} ${r.name}`.trim(); };

/* ---------- 실거래가 불러오기 ---------- */
// 한 달씩 나눠 4개씩 동시에 요청한다. 서버리스 함수의 실행 시간 제한을 피하고, 달마다 결과가 공유 캐시(CDN)에 쌓인다.
// lawd: 시군구 5자리, from/to: YYYYMM → 거래 배열(해제 포함). onProgress(완료 수, 전체 수)
// kind: 'sale'(매매) | 'jeonse'(전세) | 'wolse'(월세). 전월세 API는 둘을 함께 주므로 월세 유무로 나눈다.
async function loadTrades(lawd, from, to, onProgress, kind = 'sale') {
  const months = monthsInRange(from, to).map((m) => m.replace('-', ''));
  if (months.length > 36) throw new Error('조회 기간은 최대 36개월입니다.');
  const out = new Array(months.length);
  let next = 0, done = 0;
  const worker = async () => {
    while (next < months.length) {
      const i = next++;
      const r = await fetch('/api/trades?' + new URLSearchParams({ lawd, ym: months[i], ...(kind === 'sale' ? {} : { type: 'rent' }) }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      out[i] = j.trades;
      onProgress?.(++done, months.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, months.length) }, worker));
  const all = out.flat();
  return kind === 'jeonse' ? all.filter((t) => !t.rent) : kind === 'wolse' ? all.filter((t) => t.rent > 0) : all;
}

/* ---------- 같은 단지의 매매·전세·월세 ---------- */
// 조회한 종류는 go 버튼이 캐시에 넣어 두고, 나머지 두 종류는 같은 지역·기간으로 처음 열 때 불러온다.
const kindCache = new Map();
function kindRows(kind) {
  const key = [kind, state.lawd, state.from, state.to].join('|');
  if (!kindCache.has(key)) kindCache.set(key, loadTrades(state.lawd, state.from, state.to, null, kind).then((r) => r.filter((t) => !t.canceled)));
  return kindCache.get(key);
}

const NUM = (a, b) => a - b;
const periodLabel = (f = state.from, t = state.to) => (f.slice(0, 4) === t.slice(0, 4)
  ? `${f.slice(0, 4)}.${+f.slice(4)}~${+t.slice(4)}` : `${f.slice(0, 4)}.${+f.slice(4)}~${t.slice(0, 4)}.${+t.slice(4)}`);
const mmdd = (s) => s.slice(5).replace('-', '.');
const mkd = (name) => document.querySelector(name);

let selToken = 0;
async function selectApt() {
  const key = $('apt').value;
  if (!key) return;
  const tk = ++selToken, st = $('status'), prev = st.textContent;
  st.className = ''; st.textContent = '같은 단지의 매매·전세·월세 거래를 불러오는 중…';
  let rows;
  try { rows = await Promise.all(['sale', 'jeonse', 'wolse'].map(kindRows)); }
  catch (e) { if (tk === selToken) { st.className = 'err'; st.textContent = '거래를 불러오지 못했습니다: ' + e.message; } return; }
  if (tk !== selToken) return;
  st.textContent = prev.startsWith('같은 단지') ? '' : prev;
  const D = {};
  // 전월세 자료는 면적이 소수점 넷째 자리까지 오는 경우가 있어 둘째 자리로 맞춘다
  ['sale', 'jeonse', 'wolse'].forEach((k, i) => { D[k] = prepTrades(rows[i], key).map((t) => ({ ...t, area: Math.round(t.area * 100) / 100 })); });
  const all = [...D.sale, ...D.jeonse, ...D.wolse];
  if (!all.length) { $('dash').hidden = true; return; }
  state.data = D; state.aptKey = key;
  state.gt = all.find((t) => t.jibun) || all[0];   // 공시가격 필지 조회에 쓸 지번
  resetGongsi();
  state.areas = [...new Set(all.map((t) => t.area))].sort(NUM);
  const base = D[state.tab].length ? D[state.tab] : all;
  state.pick = d3.greatest(d3.rollups(base, (v) => v.length, (t) => t.area), (d) => d[1])[0];
  const t0 = all[0], dong = d3.greatest(d3.rollups(all, (v) => v.length, (t) => t.dong), (d) => d[1])[0];
  const built = (all.find((t) => t.built) || {}).built;
  state.apt = t0.apt; state.dong = dong; state.built = built;
  $('h-title').textContent = t0.apt;
  $('h-sub').textContent = `${regionLabel()} ${dong}${built ? ' · ' + built + '년 준공' : ''} · 조회기간: ${periodLabel()}`;
  $('dash').hidden = false;
  render();
}

for (const b of $('tabs').children) b.addEventListener('click', () => { state.tab = b.dataset.k; if (KINDS[state.tab]) $('kind').value = state.tab; render(); });

/* ---------- 화면 조각 ---------- */
const card = (title, note) => {
  const s = mk('section', null, 'gx-card');
  if (title) s.append(mk('h2', title));
  if (note) s.append(mk('p', note, 'gx-note'));
  return s;
};
const stat = (k, v, s) => { const d = mk('div', null, 'gx-stat'); d.append(mk('div', k, 'k'), mk('div', v, 'v')); if (s) d.append(mk('div', s, 's')); return d; };
const statsRow = (...items) => { const d = mk('div', null, 'gx-stats'); d.append(...items); return d; };
const fmtRent = d3.format(',.1~f');
const KNAME = { sale: '매매', jeonse: '전세', wolse: '월세' };

function render() {
  if (!state.data) return;
  const { tab, pick, data: D } = state;
  // 공시가격 탭은 전용면적 칩·거래 목록 대신 자기 필터와 표를 쓴다
  const isG = tab === 'gongsi', isC = tab === 'cmp';
  for (const id of ['pick-h', 'pick-note', 'chips-pick', 'tab-body']) $(id).hidden = isG || isC;
  $('gs-card').hidden = !isG;
  $('cmp-body').hidden = !isC;
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', String(b.dataset.k === tab));
  if (isG) { ensureGongsi(); infoRender(); return; }
  if (isC) { renderCmp(); infoRender(); return; }
  const chips = $('chips-pick');
  chips.replaceChildren(...state.areas.map((a) => {
    const n = D[tab].filter((t) => t.area === a).length;
    const b = mk('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(a === pick));
    b.append(mk('b', `전용 ${a}㎡`), mk('small', `약 ${pyeong(a)}평 · ${KNAME[tab]} ${n}건`));
    b.addEventListener('click', () => { state.pick = a; render(); });
    return b;
  }));
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', String(b.dataset.k === tab));
  const body = $('tab-body'); body.replaceChildren();
  const rows = D[tab].filter((t) => t.area === pick);
  ({ sale: saleBody, jeonse: jeonseBody, wolse: wolseBody })[tab](body, rows);
  askCard(body, rows, tab);
  tradeList(body, inBand(rows));   // 목록은 그래프에 쓴 거래와 같게 맞춘다
  infoRender();
}

function saleBody(body, rows) {
  const k = card(null);
  const latest = d3.max(rows, (t) => t.date);
  let rec = [], cut = '';
  if (latest) {
    cut = d3.utcFormat('%Y-%m-%d')(d3.utcMonth.offset(new Date(latest + 'T00:00:00Z'), -3));
    rec = rows.filter((t) => t.date > cut);
  }
  k.append(statsRow(
    stat('거래 건수', `${fmt(rows.length)}건`, '해제 거래 제외'),
    stat('중간값', rows.length ? won(med(rows)) : '-', '가장 가운데 거래'),
    stat('가장 낮은 거래', rows.length ? won(d3.min(rows, (t) => t.price)) : '-'),
    stat('가장 높은 거래', rows.length ? won(d3.max(rows, (t) => t.price)) : '-'),
    stat('최근 3개월 중간값', rec.length ? won(med(rec)) : '-', rec.length ? `${rec.length}건 · ${mmdd(cut)} ~ ${mmdd(latest)}` : '최근 3개월 거래 없음')));
  body.append(k);

}

function jeonseBody(body, rows) {

}

function legendDots(el, items) {

    i.style.cssText = `border-radius:50%;box-sizing:border-box;${hollow ? 'background:transparent;border:2px solid var(--color-fg)' : 'background:var(--color-fg)'}`;
    s.append(i, document.createTextNode(name)); return s;
  }));
}

// 점 위에 올리면 나오는 설명 + 가장 가까운 점 찾기를 공유하는 SVG 점 그래프
function plot(el, pts, o) {
  const W = Math.max(el.clientWidth, 280), H = o.h || 320, m = { t: 12, r: 16, b: 30, l: 56 };
  const x = o.x.range([m.l, W - m.r]), y = o.y.range([H - m.b, m.t]);
  const svg = d3.select(el).append('svg').attr('width', '100%').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);
  svg.append('g').selectAll('line').data(y.ticks(o.yticks || 5)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', (d) => y(d)).attr('y2', (d) => y(d)).style('stroke', 'var(--cds-chart-grid)');
  axisStyle(svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(o.xticks).tickFormat(o.xfmt).tickSizeOuter(0)));
  axisStyle(svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(o.yticks || 5).tickFormat(o.yfmt).tickSize(0)).call((g) => g.select('.domain').remove()));
  const P = pts.map((t) => ({ t, px: x(o.xv(t)), py: y(o.yv(t)) }));
  svg.append('g').selectAll('circle').data(P).join('circle').attr('cx', (p) => p.px).attr('cy', (p) => p.py).attr('r', 4)
    .style('fill', (p) => (p.t.gbn === '갱신' ? 'var(--color-bg)' : (o.colorOf ? o.colorOf(p.t) : o.color))).style('stroke', (p) => (o.colorOf ? o.colorOf(p.t) : o.color))
    .attr('stroke-width', (p) => (p.t.gbn === '갱신' ? 2 : 0)).attr('opacity', (p) => (p.t.gbn === '갱신' ? 1 : 0.7));
  if (o.after) o.after(svg, x, y);
  const dot = svg.append('circle').attr('r', 8).attr('fill', 'none').attr('stroke-width', 2).style('stroke', 'var(--color-fg)').style('display', 'none');
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
    .on('pointermove', (ev) => {
      const [mx, my] = d3.pointer(ev);
      let best = null, bd = Infinity;
      for (const p of P) { const d = (p.px - mx) ** 2 + (p.py - my) ** 2; if (d < bd) { bd = d; best = p; } }
      if (!best || bd > 28 ** 2) { dot.style('display', 'none'); hideTip(el); return; }
      dot.style('display', null).attr('cx', best.px).attr('cy', best.py);
      tip(el, o.tip(best.t), best.px, best.py);
    })
    .on('pointerleave', () => { dot.style('display', 'none'); hideTip(el); });
}
function plotBox(parent) {
  const wrap = mk('div', null, 'gx-plot'), el = mk('div', null, 'gx-chart');
  wrap.append(el, mk('div', null, 'gx-tip')); parent.append(wrap); return el;
}

// 계약일–가격 점 그래프 (매매·전세)
const bandOf = (t) => FLOOR_BANDS.find((b) => t.floor >= b[2] && t.floor <= b[3]) || FLOOR_BANDS[0];
// 층 구간(저·중·고층) 범례. 구간마다 건수와 요약값을 보여 주고, withLine이면 월별 중간값 선 설명을 덧붙인다
// 고른 층 구간(state.band)만 남긴다. 구간을 다시 누르면 전체로 돌아간다
const byBand = (rows) => (state.band == null ? rows : rows.filter((t) => bandOf(t) === FLOOR_BANDS[state.band]));
// 전세·월세: 고른 계약 구분(신규·갱신)만 남긴다. 매매에는 적용하지 않는다
const byCont = (rows) => (state.cont == null || state.tab === 'sale' ? rows : rows.filter((t) => t.gbn === state.cont));
const inBand = (rows) => byBand(byCont(rows));
// 전체 / 신규(채운 점) / 갱신(속이 빈 점) 버튼. 개수는 고른 층 구간 기준
function contractLegend(k, rows) {
  const base = byBand(rows), lg = mk('div', null, state.cont == null ? 'gx-legend' : 'gx-legend sel'); k.append(lg);
  const item = (name, v, cont, hollow) => {
    const b = mk('button'), i = mk('i');
    b.type = 'button'; b.setAttribute('aria-pressed', String(state.cont === cont));
    i.style.cssText = `border-radius:50%;box-sizing:border-box;${hollow === undefined ? 'background:var(--color-fg-muted)' : hollow ? 'background:transparent;border:2px solid var(--color-fg)' : 'background:var(--color-fg)'}`;
    b.append(i, mk('b', name), document.createTextNode(` · ${v.length}건`));
    b.addEventListener('click', () => { state.cont = state.cont === cont ? null : cont; render(); });
    lg.append(b);
  };
  item('전체', base, null);
  item('신규', base.filter((t) => t.gbn === '신규'), '신규', false);
  item('갱신', base.filter((t) => t.gbn === '갱신'), '갱신', true);
}
function bandLegend(k, rows, summary, withLine) {
  rows = byCont(rows);
  const lg = mk('div', null, state.band == null ? 'gx-legend' : 'gx-legend sel'); k.append(lg);
  // 맨 앞 '전체': 층 구간 선택을 풀고 모든 거래를 보여 준다
  const all = mk('button'), ai = mk('i');
  all.type = 'button'; all.setAttribute('aria-pressed', String(state.band == null));
  all.addEventListener('click', () => { state.band = null; render(); });
  ai.style.cssText = 'border-radius:50%;background:var(--color-fg-muted)';
  all.append(ai, mk('b', '전체'), document.createTextNode(` 모든 층 · ${rows.length}건${rows.length ? ' · ' + summary(rows) : ''}`));
  lg.append(all);
  FLOOR_BANDS.forEach((b, bi) => {
    const v = rows.filter((t) => bandOf(t) === b), sp = mk('button'), i = mk('i');
    sp.type = 'button'; sp.title = '누르면 이 층 구간만 봅니다'; sp.setAttribute('aria-pressed', String(state.band === bi));
    sp.addEventListener('click', () => { state.band = state.band === bi ? null : bi; render(); });
    i.style.cssText = `border-radius:50%;background:${b[4]}`;
    sp.append(i, mk('b', b[0]), document.createTextNode(` ${b[1]} · ${v.length}건${v.length ? ' · ' + summary(v) : ''}`));
    lg.append(sp);
  });
  if (withLine) {
    const sp = mk('span'), ln = mk('i');
    ln.style.cssText = 'width:1.1rem;height:3px;border-radius:2px;background:var(--color-fg)';
    sp.append(ln, mk('b', '월별 중간값'), document.createTextNode(' 한 달 3건 이상일 때만, 건너뛴 달은 선을 잇지 않음'));
    lg.append(sp);
  }
}
// bands: 층 구간별 색 + 월별 중간값 선
const FLOOR_BANDS = [['저층', '1~8층', 1, 8, 'var(--c0)'], ['중층', '9~16층', 9, 16, 'var(--c1)'], ['고층', '17층 이상', 17, Infinity, 'var(--c2)']];
function dotChart(body, rows, title, note, legendItems, bands) {
  const k = card(title, note);
  body.append(k);
  if (!rows.length) { k.append(mk('div', '표시할 거래가 없습니다.', 'gx-empty')); return; }
  if (legendItems.length) contractLegend(k, rows);   // 전세: 신규·갱신 구분
  if (bands) { bandLegend(k, rows, (v) => `중간값 ${won(med(v))}`, true); rows = inBand(rows); }
  if (!rows.length) { k.append(mk('div', '이 층 구간에는 거래가 없습니다.', 'gx-empty')); return; }
  const utc = (s) => new Date(s + 'T00:00:00Z'), months = monthsInRange();
  const first = utc(months[0] + '-01'), last = d3.utcMonth.offset(utc(months.at(-1) + '-01'), 1);
  const ys = d3.extent(rows, (t) => t.price), pad = (ys[1] - ys[0]) * 0.08 || 1000;
  const step = months.length > 30 ? 6 : months.length > 14 ? 3 : 1;
  const el = plotBox(k), isSale = state.tab === 'sale';
  plot(el, rows, {
    x: d3.scaleUtc().domain([first, last]), y: d3.scaleLinear().domain([ys[0] - pad, ys[1] + pad]).nice(),
    xv: (t) => utc(t.date), yv: (t) => t.price, color: 'var(--c0)', colorOf: bands ? (t) => bandOf(t)[4] : null,
    after: bands ? (svg, x, y) => {
      // 한 달 3건 이상인 달만 중간값을 구하고, 달이 이어질 때만 선으로 잇는다
      const med3 = months.map((mo) => ({ mo, v: rows.filter((t) => t.ym === mo) })).filter((o) => o.v.length >= 3)
        .map((o) => ({ i: months.indexOf(o.mo), px: x(utc(o.mo + '-16')), py: y(d3.median(o.v, (t) => t.price)) }));
      const segs = []; let cur = [];
      med3.forEach((p, n) => { if (n && p.i - med3[n - 1].i > 1) { segs.push(cur); cur = []; } cur.push(p); });
      if (cur.length) segs.push(cur);
      for (const sg of segs) if (sg.length > 1) svg.append('path').attr('d', d3.line().x((p) => p.px).y((p) => p.py)(sg)).attr('fill', 'none').attr('stroke-width', 2.5).attr('stroke-linejoin', 'round').style('stroke', 'var(--color-fg)');
      svg.append('g').selectAll('circle').data(med3).join('circle').attr('cx', (p) => p.px).attr('cy', (p) => p.py).attr('r', 4.5).style('fill', 'var(--color-bg)').style('stroke', 'var(--color-fg)').attr('stroke-width', 2);
    } : null,
    xticks: d3.utcMonth.every(el.clientWidth < 520 ? step * 2 : step), xfmt: d3.utcFormat('%y.%m'), yticks: 6, yfmt: (d) => eok(d) + '억',
    tip: (t) => [`${t.date} · ${t.dong} · ${t.floor}층`, `${isSale ? '거래가' : '보증금'} ${won(t.price)}` + (t.gbn ? ` · ${t.gbn}` : '')],
  });
  const pr = rows.map((t) => t.price);
  k.append(mk('p', `표본 ${fmt(rows.length)}건 · ${ymLabel(state.from)} ~ ${ymLabel(state.to)} · 최저 ${won(d3.min(pr))} · 중간값 ${won(d3.median(pr))} · 최고 ${won(d3.max(pr))} · 출처 국토교통부 실거래가 공개시스템(계약일 기준)${bands ? ' · 세로축은 0원에서 시작하지 않고 이 면적의 가격 범위에 맞춰 표시했으니 눈금의 숫자를 함께 읽어 주세요.' : ''}`, 'gx-note'));
}

// 보증금–월세 점 그래프 (월세). 두 축 모두 0에서 시작한다.
function rentPlot(k, rows) {
  if (!rows.length) { k.append(mk('div', '표시할 거래가 없습니다.', 'gx-empty')); return; }
  const el = plotBox(k);
  const xf = (v) => (v === 0 ? '0' : v < 10000 ? `${+(v / 1000).toFixed(1)}천만` : `${+(v / 10000).toFixed(1)}억`);
  plot(el, rows, {
    x: d3.scaleLinear().domain([0, d3.max(rows, (t) => t.price)]).nice(), y: d3.scaleLinear().domain([0, d3.max(rows, (t) => t.rent)]).nice(),
    xv: (t) => t.price, yv: (t) => t.rent, color: 'var(--c0)', colorOf: (t) => bandOf(t)[4], xticks: el.clientWidth < 520 ? 4 : 6, xfmt: xf, yticks: 4, yfmt: (d) => `${d}만`,
    tip: (t) => [`${t.date} · ${t.dong} · ${t.floor}층${t.gbn ? ' · ' + t.gbn : ''}`, `보증금 ${won(t.price)} · 월세 ${fmt(t.rent)}만원`],
  });
}

function tradeList(body, rows) {
  const k = card('그래프에 쓴 거래 목록', `전용 ${state.pick}㎡ · ${rows.length.toLocaleString()}건 · 최근 거래순` + (rows.length > 500 ? ' (최근 500건만 표시)' : ''));
  const sale = state.tab === 'sale', wolse = state.tab === 'wolse';
  const list = [...rows].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 500);
  const tbl = mkTable(['계약일', '동', '층', sale ? '거래가(만원)' : '보증금(만원)', ...(wolse ? ['월세(만원)'] : []), sale ? '거래 방식' : '계약구분', '상태'],
    list.map((r) => [r.date, r.dong, String(r.floor), fmt(r.price), ...(wolse ? [fmt(r.rent)] : []), r.gbn || '—', '정상']), [0, 1]);
  k.classList.add('no-print');   // PDF에는 넣지 않는다

}

/* ---------- 현재 호가와 실거래 비교 (호가는 사용자가 직접 입력) ---------- */
// 입력값은 state.ask에만 두고, 탭·면적을 바꿔도 남긴다. 저장하거나 서버로 보내지 않는다.
function askCard(body, rows, tab) {
  const A = state.ask[tab];   // 거래 종류마다 따로 기억한다(매매 호가가 월세 보증금 칸에 남지 않게)
  const wolse = tab === 'wolse', KN = KNAME[tab], PN = tab === 'sale' ? '거래가' : '보증금';
  const k = card(`현재 호가와 실거래 비교 · ${KN}`, '매물 호가는 실제 계약가격이 아닙니다. 호가를 직접 입력하면 같은 단지·위에서 고른 전용면적의 최근 실거래와 비교합니다. 호가 자료는 이 앱이 수집하지 않으며, 입력한 값은 저장·전송되지 않고 이 화면에서만 쓰입니다.');
  const out = mk('div', null, 'gx-rblk');
  const field = (key, label, attrs) => {
    const l = mk('label', label), i = mk('input'); Object.assign(i, attrs); i.value = A[key] ?? '';
    i.addEventListener('input', () => { A[key] = i.value; upd(); });
    l.append(i); return l;
  };
  const row = mk('div', null, 'gx-row');
  row.append(field('price', (wolse ? '보증금' : KN) + ' 호가(만원)', { type: 'number', min: 0, step: 100, placeholder: '예: 125000' }));
  if (wolse) row.append(field('rent', '월세 호가(만원)', { type: 'number', min: 0, step: 1, placeholder: '예: 80' }));
  row.append(field('floor', '층(선택)', { type: 'number', min: 1, step: 1 }),
    field('src', '호가 출처', { type: 'text', placeholder: '예: ○○부동산 매물' }),
    field('date', '호가 기준일', { type: 'date' }));
  const ctrl = mk('div', null, 'gx-ctrl'); ctrl.append(row);
  k.append(ctrl, out); body.append(k);

  function upd() {
    const months = monthsInRange(), cut = months.length > 6 ? months[months.length - 6] : months[0];
    const rec = rows.filter((t) => t.ym >= cut), recOk = rec.length >= LOW, use = recOk ? rec : rows;
    const basis = recOk ? `최근 6개월(${cut.replace('-', '.')}~)` : `조회 전체 기간(최근 6개월 ${rec.length}건뿐)`;
    out.replaceChildren();
    if (!use.length) { out.append(mk('p', '이 전용면적은 조회 기간에 거래가 없어 비교할 수 없습니다.', 'gx-note')); return; }
    const mdn = med(use), lo = d3.min(use, (t) => t.price), hi = d3.max(use, (t) => t.price);
    const a = { price: '', rent: '', floor: '', src: '', date: '', ...A }, price = parseFloat(a.price), rent = parseFloat(a.rent), floor = parseInt(a.floor, 10);
    const pairs = [['비교 기준', `같은 단지 · 전용 ${state.pick}㎡ · ${basis} ${KN} 거래 ${use.length}건`], ['실거래 중간값', won(mdn)], ['실거래 범위', `${won(lo)} ~ ${won(hi)}`]];
    if (wolse) pairs.splice(2, 0, ['실거래 월세 중간값', `${fmtRent(d3.median(use, (t) => t.rent))}만원`]);
    const kv = mkKv(pairs);
    if (use.length < LOW) kv.children[1].append(mk('span', '표본 적음', 'gx-badge'));
    out.append(kv);
    if (!(price > 0)) { out.append(mk('p', `${wolse ? '보증금' : KN} 호가를 입력하면 차액과 비율, 유사 거래와의 비교가 나옵니다.`, 'gx-note')); return; }
    const sgn = (v) => (v >= 0 ? '+' : '−');
    const diff = price - mdn, pct = diff / mdn;
    const res = [['입력한 호가', won(price) + (floor > 0 ? ` · ${floor}층` : '')],
      [`호가 − 실거래 중간값`, `${diff === 0 ? '0원' : sgn(diff) + won(Math.abs(diff))} (${d3.format('+.2%')(pct)})`],
      ['호가의 위치', `비교 거래 ${use.length}건 중 ${use.filter((t) => t.price < price).length}건보다 높고 ${use.filter((t) => t.price > price).length}건보다 낮음`],
      ['호가 출처·기준일', `${a.src.trim() || '출처 미입력'} · ${a.date || '기준일 미입력'}`]];
    if (wolse && a.rent !== '' && rent >= 0) {
      const rm = d3.median(use, (t) => t.rent);
      res.splice(2, 0, ['월세 호가 − 실거래 월세 중간값', `${sgn(rent - rm)}${fmtRent(Math.abs(rent - rm))}만원 (호가 ${fmt(rent)}만원 / 중간값 ${fmtRent(rm)}만원)`]);
    }
    const kv2 = mkKv(res); kv2.style.marginTop = '.6rem'; out.append(kv2);
    const sim = [...use].sort((x, y) => (floor > 0 ? Math.abs(x.floor - floor) - Math.abs(y.floor - floor) : 0) || (x.date < y.date ? 1 : -1)).slice(0, 8);
    out.append(mk('p', `유사 거래 ${sim.length}건 (${floor > 0 ? '입력한 층과 가까운 순, 같은 층이면 최근순' : '최근순'}) — 층·거래 시점이 다르면 가격이 달라질 수 있습니다.`, 'gx-note'));
    out.append(mkTable(['계약일', '층', ...(floor > 0 ? ['층 차이'] : []), `${PN}(만원)`, ...(wolse ? ['월세(만원)'] : []), '호가 대비'],
      sim.map((t) => [t.date, String(t.floor), ...(floor > 0 ? [`${t.floor - floor >= 0 ? '+' : ''}${t.floor - floor}`] : []), fmt(t.price), ...(wolse ? [fmt(t.rent)] : []),
        `${sgn(price - t.price)}${fmt(Math.abs(price - t.price))}`]), [0]));
    out.append(mk('p', '호가는 매도·임대인이 부르는 가격이고 실거래가는 실제 체결 가격입니다. 둘의 차이가 곧 적정가격이나 협상 가능 금액을 뜻하지는 않습니다.', 'gx-note'));
  }
  upd();
}

/* ---------- 동·호별 공시가격 (V-World, 서버 /api/gongsi) ---------- */
const gs = { info: null, year: null, rows: [], sizes: [], names: [], sort: { col: 'd', dir: 1 }, token: 0 };
const gsCache = new Map();
const GS_COLS = [['d', '동'], ['h', '호'], ['f', '층'], ['a', '전용(㎡)'], ['p', '공시가격(만원)'], ['ppy', '전용 평당가(만원)']];

function resetGongsi() {
  gs.token++; gs.info = null; gs.rows = []; gs.year = null;
  $('gs-body').hidden = true;
  $('gs-load').disabled = false; $('gs-load').textContent = '공시가격 조회';
  $('gs-status').className = 'gx-note'; $('gs-status').textContent = '';
}
async function gsApi(path, params) {
  const r = await fetch(path + '?' + new URLSearchParams(params));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
// 선택한 단지의 주소: 시도 시군구 법정동 지번 (조회한 지역 기준)
function gongsiAddr() {
  const reg = state.regions.find((x) => x.code === state.lawd) || { sido: '', name: '' };
  const t0 = state.gt;
  if (!t0 || !t0.jibun) throw new Error('이 단지는 실거래 자료에 지번 정보가 없어 필지를 찾을 수 없습니다.');
  return [reg.sido, reg.name === reg.sido ? '' : reg.name, t0.dong, t0.jibun].filter(Boolean).join(' ');
}
// 탭을 열거나 단지를 바꿀 때, 아직 안 불러왔고 조회 중이 아니면 자동으로 불러온다 (결과는 서버가 캐시)
function ensureGongsi() { if (state.data && !gs.info && !$('gs-load').disabled) loadGongsi(); }
$('gs-load').onclick = () => loadGongsi();

async function loadGongsi() {
  const btn = $('gs-load'), st = $('gs-status'), tk = ++gs.token;
  btn.disabled = true; st.className = 'gx-note'; st.textContent = '필지를 찾는 중…';
  try {
    const info = await gsApi('/api/gongsi/years', { addr: gongsiAddr() });
    if (tk !== gs.token) return;
    if (!info.years.length) throw new Error(`공시가격 자료가 없습니다 (필지 ${info.address}).`);
    gs.info = info;
    $('gs-year').replaceChildren(...info.years.map((y) => new Option(y + '년', y)));
    await loadGongsiYear(info.years[0], tk);
  } catch (e) { if (tk === gs.token) { st.className = 'gx-note err'; st.textContent = e.message; btn.disabled = false; } }
}
async function loadGongsiYear(year, tk = gs.token) {
  const st = $('gs-status');
  st.className = 'gx-note'; st.textContent = `${year}년 공시가격을 불러오는 중… (호수가 많으면 몇 초 걸립니다)`;
  const key = gs.info.pnu + '|' + year;
  let d = gsCache.get(key);
  if (!d) { d = await gsApi('/api/gongsi/units', { pnu: gs.info.pnu, year }); gsCache.set(key, d); }
  if (tk !== gs.token) return;
  gs.year = year; gs.names = d.names;
  gs.rows = d.rows.map(([dong, ho, floor, area, price, n]) => ({ d: dong, h: ho, f: floor, a: area, p: price, ppy: Math.round(price / (area / PY)), n, size: Math.round(area * 100) / 100 }));
  gs.sizes = [...new Set(gs.rows.map((r) => r.size))].sort(NUM);
  $('gs-year').value = year;
  $('gs-dong').value = ''; $('gs-size').value = ''; $('gs-ho').value = '';
  refreshGsFilters();
  $('gs-body').hidden = false;
  $('gs-load').textContent = '다시 조회'; $('gs-load').disabled = false;
  const nm = d.names.join(', ');
  st.textContent = `${gs.info.address}${nm ? ' · ' + nm : ''}`;
  renderGongsi(); infoRender();
}
$('gs-year').onchange = async () => { try { await loadGongsiYear(Number($('gs-year').value)); } catch (e) { $('gs-status').className = 'gx-note err'; $('gs-status').textContent = e.message; } };
// 동·면적·호 드롭다운 연동: 한쪽을 고르면 다른 쪽에는 그 조건에 실제로 있는 항목만 보여 준다
function refreshGsFilters() {
  const f = { d: $('gs-dong').value, s: $('gs-size').value, h: $('gs-ho').value };
  const rowsFor = (skip) => gs.rows.filter((r) => (skip === 'd' || !f.d || r.d === f.d) && (skip === 's' || !f.s || String(r.size) === f.s) && (skip === 'h' || !f.h || r.h === f.h));
  const dongs = [...new Set(rowsFor('d').map((r) => r.d))];
  const sizeSet = new Set(rowsFor('s').map((r) => r.size));
  const hos = [...new Set(rowsFor('h').map((r) => r.h))]
    .sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || String(a).localeCompare(String(b), 'ko'));
  $('gs-dong').replaceChildren(new Option('전체', ''), ...dongs.map((x) => new Option(x + '동', x)));
  $('gs-size').replaceChildren(new Option('전체', ''), ...gs.sizes.filter((z) => sizeSet.has(z)).map((z) => new Option(`전용 ${z}㎡ (약 ${pyeong(z)}평)`, z)));
  $('gs-ho').replaceChildren(new Option('전체', ''), ...hos.map((x) => new Option(x + '호', x)));
  $('gs-dong').value = f.d; $('gs-size').value = f.s; $('gs-ho').value = f.h;
}
$('gs-dong').onchange = $('gs-size').onchange = $('gs-ho').onchange = () => { refreshGsFilters(); renderGongsi(); };
const gsFiltered = () => {
  const dong = $('gs-dong').value, size = $('gs-size').value, ho = $('gs-ho').value;
  return gs.rows.filter((r) => (!dong || r.d === dong) && (!size || String(r.size) === size) && (!ho || r.h === ho));
};

function renderGongsi() {
  const rows = gsFiltered(), s = gs.sort;
  const num = (v) => { const n = parseInt(v, 10); return Number.isNaN(n) ? v : n; };
  const key = (r) => (s.col === 'd' || s.col === 'h' ? num(r[s.col]) : r[s.col]);
  const sorted = [...rows].sort((a, b) => {
    const x = key(a), y = key(b);
    return (typeof x === 'string' || typeof y === 'string' ? String(x).localeCompare(String(y), 'ko') : x - y) * s.dir
      || num(a.d) - num(b.d) || num(a.h) - num(b.h);
  });
  const ps = rows.map((r) => r.p);
  $('gs-stats').replaceChildren(...(rows.length ? [
    stat('호수', `${fmt(rows.length)}호`, `${gs.year}년 공시기준`),
    stat('공시가격 중간값', won(d3.median(ps)), '가장 가운데 호'),
    stat('평균', won(d3.mean(ps))),
    stat('최저', won(d3.min(ps))),
    stat('최고', won(d3.max(ps))),
  ] : [mk('p', '조건에 맞는 호가 없습니다.', 'gx-note')]));
  $('gs-tbl').querySelector('thead tr').replaceChildren(...GS_COLS.map(([c, t]) => {
    const th = mk('th', t + (s.col === c ? (s.dir > 0 ? ' ▲' : ' ▼') : ''));
    th.addEventListener('click', () => { s.dir = s.col === c ? -s.dir : 1; s.col = c; renderGongsi(); });
    return th;
  }));
  const LIMIT = 300;
  $('gs-tbl').querySelector('tbody').replaceChildren(...sorted.slice(0, LIMIT).map((r) => {
    const tr = mk('tr');
    [r.d, r.h, r.f, r.a, fmt(r.p), fmt(r.ppy)].forEach((t) => tr.append(mk('td', String(t))));
    return tr;
  }));
  $('gs-more').textContent = rows.length > LIMIT ? `상위 ${LIMIT}행만 표시했습니다. 동·전용면적으로 좁혀 보세요.` : '';
}

/* ---------- 단지비교 (최대 4개, 조회한 지역·기간 안에서) ---------- */
const CMP_MAX = 4;
const cmp = { keys: [], areas: {}, ctx: '', by: null, token: 0, err: '' };   // by[kind]: 단지키 → 거래 배열
const cmpName = (k) => { const [dong, apt] = k.split('|'); return `${apt} (${dong})`; };

async function renderCmp() {
  const ctx = [state.lawd, state.from, state.to].join('|'), tk = ++cmp.token, body = $('cmp-body');
  if (cmp.ctx !== ctx) { cmp.ctx = ctx; cmp.keys = []; cmp.areas = {}; cmp.by = null; }
  if (!cmp.by) {
    body.replaceChildren(card('단지비교', '같은 지역·기간의 매매·전세·월세 거래를 불러오는 중…'));
    try {
      const rows = await Promise.all(['sale', 'jeonse', 'wolse'].map(kindRows));
      if (tk !== cmp.token) return;
      cmp.by = {};
      ['sale', 'jeonse', 'wolse'].forEach((k, i) => {
        cmp.by[k] = d3.group(rows[i].map((t) => ({ ...t, ym: t.date.slice(0, 7), area: Math.round(t.area * 100) / 100 })), aptKey);
      });
    } catch (e) { if (tk === cmp.token) body.replaceChildren(card('단지비교', '거래를 불러오지 못했습니다: ' + e.message)); return; }
  }
  if (!cmp.keys.length && state.aptKey) cmp.keys = [state.aptKey];
  drawCmp(body);
}

function drawCmp(body) {
  const rowsOf = (kind, key) => cmp.by[kind].get(key) || [];
  const allKeys = new Set(); for (const k of ['sale', 'jeonse', 'wolse']) for (const key of cmp.by[k].keys()) allKeys.add(key);
  const total = (key) => ['sale', 'jeonse', 'wolse'].reduce((s, k) => s + rowsOf(k, key).length, 0);
  const options = [...allKeys].filter((k) => !cmp.keys.includes(k)).sort((a, b) => total(b) - total(a) || cmpName(a).localeCompare(cmpName(b), 'ko'));

  /* 단지 고르기 */
  const pick = card('단지비교', `${regionLabel()} · ${periodLabel()} 계약분. 같은 지역에서 최대 ${CMP_MAX}개 단지를 골라, 단지마다 전용면적을 따로 선택해 비교합니다.`);
  // 단지마다 거래가 있는 전용면적(자료 그대로)을 따로 고른다. 기본값은 거래가 가장 많은 면적(같으면 84㎡에 가까운 쪽)
  const areaStat = (key) => {
    const c = new Map();
    for (const k of ['sale', 'jeonse', 'wolse']) for (const t of rowsOf(k, key)) c.set(t.area, (c.get(t.area) || 0) + 1);
    return c;
  };
  for (const key of cmp.keys) {
    const c = areaStat(key);
    if (!c.has(cmp.areas[key])) cmp.areas[key] = [...c.keys()].sort((a, b) => c.get(b) - c.get(a) || Math.abs(a - 84) - Math.abs(b - 84))[0];
  }
  const chips = mk('div', null, 'gx-col');
  cmp.keys.forEach((key, i) => {
    const line = mk('div', null, 'gx-row'), b = mk('button'), dot = mk('i');
    line.style.alignItems = 'center';
    b.type = 'button'; b.title = '누르면 비교에서 뺍니다'; b.className = 'gx-pill';
    dot.style.cssText = `display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:${col(i)}`;
    b.append(dot, document.createTextNode(` ${cmpName(key)} ×`));
    b.addEventListener('click', () => { cmp.keys.splice(i, 1); drawCmp(body); });
    const c = areaStat(key), as = mk('select');
    for (const a of [...c.keys()].sort(NUM)) as.append(new Option(`전용 ${a}㎡ (약 ${pyeong(a)}평) · ${c.get(a)}건`, a));
    as.value = cmp.areas[key];
    as.addEventListener('change', () => { cmp.areas[key] = Number(as.value); drawCmp(body); });
    const lab = mk('label', '전용면적'); lab.append(as);
    line.append(b, lab); chips.append(line);
  });
  const sel = mk('select'), ctrl = mk('div', null, 'gx-ctrl'), row = mk('div', null, 'gx-row'), add = mk('button', '추가');
  sel.style.minWidth = '18rem';
  sel.append(new Option(cmp.keys.length >= CMP_MAX ? `최대 ${CMP_MAX}개까지 비교할 수 있습니다` : '단지 선택…', ''));
  for (const k of options) sel.append(new Option(`${cmpName(k)} · ${total(k)}건`, k));
  sel.disabled = add.disabled = cmp.keys.length >= CMP_MAX;
  add.type = 'button';
  add.addEventListener('click', () => { if (sel.value && cmp.keys.length < CMP_MAX) { cmp.keys.push(sel.value); drawCmp(body); } });
  const lab = mk('label', '단지 추가'); lab.append(sel); row.append(lab, add); ctrl.append(row);
  pick.append(chips, ctrl);

  body.replaceChildren(pick);
  if (cmp.keys.length < 2) { pick.append(mk('div', '비교하려면 단지를 하나 이상 더 추가해 주세요.', 'gx-empty')); }
  if (!cmp.keys.length) return;

  /* 단지별 요약 */
  const sets = cmp.keys.map((key) => {
    const area = cmp.areas[key];
    const f = (k) => rowsOf(k, key).filter((t) => t.area === area);
    const sale = f('sale'), jeonse = f('jeonse').filter((t) => !t.rent), wolse = f('wolse').filter((t) => t.rent > 0);
    const latest = d3.max(sale, (t) => t.date);
    const cut = latest ? d3.utcFormat('%Y-%m-%d')(d3.utcMonth.offset(new Date(latest + 'T00:00:00Z'), -3)) : '';
    const rec = latest ? sale.filter((t) => t.date > cut) : [];
    const built = (rowsOf('sale', key).concat(rowsOf('jeonse', key), rowsOf('wolse', key)).find((t) => t.built) || {}).built;
    return { key, area, sale, jeonse, wolse, rec, built };
  });
  const m = (a, f = (t) => t.price) => (a.length ? d3.median(a, f) : null);
  const low = (a, s) => (a.length && a.length < LOW ? s + ' (표본 적음)' : s);
  const money = (a, f) => (a.length ? low(a, won(m(a, f))) : '—');
  const perPy = (a) => (a.length ? low(a, fmt(Math.round(m(a, (t) => t.price / (t.area / PY)))) + '만원') : '—');
  const ratio = (s) => (s.sale.length && s.jeonse.length ? (m(s.jeonse) / m(s.sale) * 100).toFixed(1) + '%' : '—');
  const metric = [
    ['준공연도', (s) => (s.built ? s.built + '년' : '—')],
    ['매매 거래 건수', (s) => `${s.sale.length}건`],
    ['매매 중간값', (s) => money(s.sale)],
    ['매매 전용 평당가', (s) => perPy(s.sale)],
    ['매매 최저 ~ 최고', (s) => (s.sale.length ? `${won(d3.min(s.sale, (t) => t.price))} ~ ${won(d3.max(s.sale, (t) => t.price))}` : '—')],
    ['최근 3개월 매매 중간값', (s) => (s.rec.length ? low(s.rec, won(m(s.rec))) : '—')],
    ['전세 거래 건수', (s) => `${s.jeonse.length}건`],
    ['전세 중간값', (s) => money(s.jeonse)],
    ['매매 대비 전세가율', ratio],
    ['월세 거래 건수', (s) => `${s.wolse.length}건`],
    ['월세 보증금 중간값', (s) => money(s.wolse)],
    ['월세 중간값', (s) => (s.wolse.length ? low(s.wolse, fmtRent(m(s.wolse, (t) => t.rent)) + '만원') : '—')],
  ];
  const sum = card('단지별 비교', '단지마다 위에서 고른 전용면적 기준입니다. 면적이 다르면 가격도 달라지니 평당가를 함께 보세요. 거래가 없는 항목은 —로 표시하고, 모든 가격은 중간값입니다.');
  const tbl = mkTable(['항목', ...sets.map((s) => `${cmpName(s.key)} · 전용 ${s.area}㎡`)], metric.map(([name, f]) => [name, ...sets.map(f)]), [0]);
  tbl.querySelectorAll('thead th').forEach((th, i) => { if (i) { const d = mk('i'); d.style.cssText = `display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.3rem;background:${col(i - 1)}`; th.prepend(d); } });
  tbl.querySelector('table').classList.add('num');
  sum.append(tbl);
  body.append(sum);

  /* 월별 중간값 추이 그래프 (매매·전세·월세) */
  const utc = (s) => new Date(s + 'T00:00:00Z'), months = monthsInRange();
  const TREND = [
    { kind: 'sale', title: '매매 가격 추이', name: '매매', what: '거래가', val: (v) => d3.median(v, (t) => t.price), yfmt: (d) => eok(d) + '억', show: (p) => `중간값 ${won(p.v)}` },
    { kind: 'jeonse', title: '전세 가격 추이', name: '전세', what: '보증금', val: (v) => d3.median(v, (t) => t.price), yfmt: (d) => eok(d) + '억', show: (p) => `보증금 중간값 ${won(p.v)}` },
    { kind: 'wolse', title: '월세 가격 추이', name: '월세', what: '월세', val: (v) => d3.median(v, (t) => t.rent), yfmt: (d) => `${fmtRent(d)}만`, show: (p) => `월세 중간값 ${fmtRent(p.v)}만원 · 보증금 중간값 ${won(p.dep)}` },
  ];
  for (const T of TREND) {
    const g = card(T.title, `단지별로 고른 전용면적의 월별 ${T.name} ${T.what} 중간값. 점 위에 올리면 단지, 월, 건수가 나옵니다. 거래가 없는 달은 이어 그리지 않습니다.${T.kind === 'wolse' ? ' 월세는 보증금에 따라 크게 달라지므로 툴팁의 보증금 중간값을 함께 보세요.' : ''}`);
    body.append(g);
    const lg = mk('div', null, 'gx-legend'); g.append(lg);
    const series = sets.map((s, i) => ({
      key: s.key, i, pts: [...d3.group(s[T.kind], (t) => t.ym)].map(([mo, v]) => ({ mo, n: v.length, v: T.val(v), dep: d3.median(v, (t) => t.price), key: s.key, i })).sort((a, b) => (a.mo < b.mo ? -1 : 1)),
    }));
    series.forEach((s) => { const sp = mk('span'), d = mk('i'); d.style.background = col(s.i); sp.append(d, document.createTextNode(`${cmpName(s.key)} 전용 ${sets[s.i].area}㎡ · ${s.pts.length ? s.pts.length + '개월' : T.name + ' 없음'}`)); lg.append(sp); });
    const pts = series.flatMap((s) => s.pts);
    if (!pts.length) { g.append(mk('div', `이 면적의 ${T.name} 거래가 없습니다.`, 'gx-empty')); continue; }
    const first = utc(months[0] + '-01'), last = d3.utcMonth.offset(utc(months.at(-1) + '-01'), 1);
    const ys = d3.extent(pts, (p) => p.v), pad = (ys[1] - ys[0]) * 0.08 || (T.kind === 'wolse' ? 5 : 1000);
    const step = months.length > 30 ? 6 : months.length > 14 ? 3 : 1;
    const el = plotBox(g);
    plot(el, pts, {
      x: d3.scaleUtc().domain([first, last]), y: d3.scaleLinear().domain([Math.max(0, ys[0] - pad), ys[1] + pad]).nice(),
      xv: (p) => utc(p.mo + '-16'), yv: (p) => p.v, color: 'var(--c0)', colorOf: (p) => col(p.i),
      after: (svg, x, y) => {
        for (const s of series) {
          const idx = (p) => months.indexOf(p.mo), segs = []; let cur = [];
          s.pts.forEach((p, n) => { if (n && idx(p) - idx(s.pts[n - 1]) > 1) { segs.push(cur); cur = []; } cur.push(p); });
          if (cur.length) segs.push(cur);
          for (const sg of segs) if (sg.length > 1) svg.append('path').attr('d', d3.line().x((p) => x(utc(p.mo + '-16'))).y((p) => y(p.v))(sg)).attr('fill', 'none').attr('stroke-width', 2).attr('stroke-linejoin', 'round').attr('opacity', 0.8).style('stroke', col(s.i));
        }
      },
      xticks: d3.utcMonth.every(el.clientWidth < 520 ? step * 2 : step), xfmt: d3.utcFormat('%y.%m'), yticks: 6, yfmt: T.yfmt,
      tip: (p) => [`${cmpName(p.key)} ${sets[p.i].area}㎡ · ${ymLabel(p.mo.replace('-', ''))}`, `${T.show(p)} · ${p.n}건`],
    });
    g.append(mk('p', '한 달에 거래가 1~2건뿐이면 그 달 중간값은 특정 거래에 크게 좌우됩니다. 세로축은 이 범위에 맞춰 표시했으니 눈금의 숫자를 함께 읽어 주세요.', 'gx-note'));
  }
}

/* ---------- PDF 저장 (브라우저 인쇄의 'PDF로 저장' 사용, 파일명: 거래유형_고객명_저장일) ---------- */
const TAB_NAME = { sale: '매매', jeonse: '전세', wolse: '월세', gongsi: '공시가격', cmp: '단지비교' };
const ymd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
const safeName = (s) => s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, '').slice(0, 30);
const ymdhm = (d) => ymd(d) + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
// 파일명에 쓰는 선택 면적: 매매·전세·월세는 고른 전용면적, 공시가격은 고른 전용면적 필터(없으면 '전체면적'), 단지비교는 단지별로 고른 면적을 +로 이음
const areaTag = () => {
  if (state.tab === 'gongsi') return $('gs-size').value ? $('gs-size').value + '㎡' : '전체면적';
  if (state.tab === 'cmp') return [...new Set(cmp.keys.map((k) => cmp.areas[k]).filter((a) => a != null))].sort(NUM).map((a) => a + '㎡').join('+') || '전체면적';
  return state.pick != null ? state.pick + '㎡' : '전체면적';
};
// 파일명에 쓰는 단지명: 단지비교는 고른 단지를 +로 잇는다(너무 길면 자른다)
const aptTag = () => {
  const names = state.tab === 'cmp' ? cmp.keys.map((k) => k.split('|')[1]) : [state.apt];
  return names.filter(Boolean).join('+').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, '').slice(0, 60) || '단지';
};
// 연락처는 입력했을 때만 고객명 다음에 붙인다
const pdfFile = (name, tel = '') => [aptTag(), areaTag(), TAB_NAME[state.tab], safeName(name) || '고객', safeName(tel), ymdhm(new Date())].filter(Boolean).join('_');
const pdfDlg = $('pdf-dlg');
let pdfLast = '', pdfTel = '';
// 매매·전세·월세 탭은 분석리포트 양식(이미지 PDF), 공시가격·단지비교 탭은 브라우저 인쇄로 저장한다
const isReportTab = () => KINDS[state.tab] != null;
const CO_KEY = 'aptReportCo', CO_DEFAULT = { name: '한산부동산', sub: '수원센트럴아이파크자이', tel: '031-234-1234', rep: '' };
const loadCo = () => { try { return { ...CO_DEFAULT, ...JSON.parse(localStorage.getItem(CO_KEY) || '{}') }; } catch { return { ...CO_DEFAULT }; } };
$('pdf-btn').onclick = () => {
  $('pdf-name').value = pdfLast; $('pdf-tel').value = pdfTel; $('pdf-file').textContent = '';
  const rep = isReportTab(), co = loadCo();
  $('pdf-co').hidden = !rep;
  $('pdf-co-name').value = co.name; $('pdf-co-sub').value = co.sub; $('pdf-co-rep').value = co.rep; $('pdf-co-tel').value = co.tel;
  $('pdf-how').textContent = rep ? '확인을 누르면 분석리포트(A4 3쪽) PDF가 바로 저장됩니다.' : '확인을 누르면 인쇄 창이 열립니다. 대상(프린터)을 PDF로 저장으로 고르세요.';
  $('pdf-ok').disabled = false;
  pdfDlg.showModal(); $('pdf-name').focus();
};
$('pdf-cancel').onclick = () => pdfDlg.close();
$('pdf-name').oninput = $('pdf-tel').oninput = () => { $('pdf-file').textContent = $('pdf-name').value.trim() ? '파일명: ' + pdfFile($('pdf-name').value, $('pdf-tel').value) + '.pdf' : ''; };
$('pdf-form').onsubmit = async (e) => {
  e.preventDefault();
  const name = $('pdf-name').value.trim();
  if (!safeName(name)) { $('pdf-file').textContent = '고객 성함을 입력해 주세요.'; $('pdf-name').focus(); return; }
  const tel = $('pdf-tel').value.trim();
  pdfLast = name; pdfTel = tel;
  if (isReportTab()) {
    const ok = $('pdf-ok'), st = $('pdf-file');
    ok.disabled = true; st.textContent = '리포트를 만드는 중… (몇 초 걸립니다)';
    try { await saveReportPdf(name, tel); pdfDlg.close(); }
    catch (ex) { st.textContent = ex.message || '리포트를 만들지 못했습니다.'; ok.disabled = false; }
    return;
  }
  pdfDlg.close();
  const old = document.title, now = new Date();
  $('print-meta').textContent = `${TAB_NAME[state.tab]} 리포트 · 저장일시 ${dtstr(now)}`;
  document.title = pdfFile(name, tel);   // 인쇄 창의 기본 파일명이 문서 제목을 따른다
  addEventListener('afterprint', () => { document.title = old; }, { once: true });
  setTimeout(() => print(), 100);
};

/* ---------- 분석리포트(A4) PDF: 앱 상태로 데이터를 만들고 public/report.js의 양식에 넣는다 ---------- */
async function saveReportPdf(name, tel) {
  if (!window.html2canvas || !window.jspdf) throw new Error('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.');
  const co = { name: $('pdf-co-name').value.trim(), sub: $('pdf-co-sub').value.trim(), rep: $('pdf-co-rep').value.trim(), tel: $('pdf-co-tel').value.trim() };
  try { localStorage.setItem(CO_KEY, JSON.stringify(co)); } catch {}
  Report.setConfig(co);
  const D = buildReportData();
  const stage = mk('div', null, 'rpt-stage');
  stage.innerHTML = Report.build(D).join('');
  document.body.append(stage);
  try {
    try { await document.fonts.load('700 16px "Noto Sans KR"', '한글'); } catch {}
    await document.fonts.ready;
    const doc = new jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pgs = stage.querySelectorAll('.pg');
    for (let i = 0; i < pgs.length; i++) {
      const cv = await html2canvas(pgs[i], { scale: 2.5, backgroundColor: '#e6d9ce', width: 794, height: 1123, windowWidth: 900, useCORS: true });
      if (i) doc.addPage('a4', 'portrait');
      doc.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    const a = mk('a'), url = URL.createObjectURL(doc.output('blob'));
    a.href = url; a.download = pdfFile(name, tel) + '.pdf'; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  } finally { stage.remove(); }
}

// 눈금 간격: 후보 중 칸 수가 maxN 이하가 되는 가장 작은 간격
const niceStep = (span, cands, maxN) => cands.find((s) => span / s <= maxN) || cands.at(-1);
const p2 = (n) => String(n).padStart(2, '0');

function buildReportData() {
  const tab = state.tab, KN = KNAME[tab], pick = state.pick, D0 = state.data, I = state.loadInfo;
  const all = [...D0.sale, ...D0.jeonse, ...D0.wolse];
  const rows = D0[tab].filter((t) => t.area === pick);
  if (!rows.length) throw new Error(`전용 ${pick}㎡의 ${KN} 거래가 없어 리포트를 만들 수 없습니다. 다른 면적을 골라 주세요.`);
  const now = new Date(), latestIso = d3.max(all, (t) => t.date) || '';
  const mlist = monthsInRange(), first = Date.UTC(+mlist[0].slice(0, 4), +mlist[0].slice(5) - 1, 1);
  const nextM = d3.utcFormat('%Y-%m')(d3.utcMonth.offset(new Date(mlist.at(-1) + '-01T00:00:00Z'), 1));
  const labels = [...mlist, nextM];
  const starts = labels.map((m) => Math.round((Date.UTC(+m.slice(0, 4), +m.slice(5) - 1, 1) - first) / 864e5));
  const dayOf = (s) => Math.round((Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) - first) / 864e5);
  const kOf = (t) => 'LMH'[FLOOR_BANDS.indexOf(bandOf(t))];
  const nw = rows.filter((t) => t.gbn === '신규'), rn = rows.filter((t) => t.gbn === '갱신');
  const D = {
    type: KN, complex: state.apt, addr: `${regionLabel()} ${state.dong}`, built: state.built ? String(state.built) : '',
    period: `${state.from.slice(0, 4)}.${state.from.slice(4)} ~ ${state.to.slice(0, 4)}.${state.to.slice(4)}`,
    saved: `${now.getFullYear()}.${p2(now.getMonth() + 1)}.${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`,
    cust: null,   // 고객명·연락처는 PDF 안에 넣지 않고 파일명에만 쓴다
    areas: state.areas.map((a) => ({ a: String(a), py: pyeong(a), n: D0[tab].filter((t) => t.area === a).length })),
    sel: { a: String(pick), n: rows.length, py: pyeong(pick) },
    latest: latestIso.replaceAll('-', '.'),
    src: '국토교통부 실거래가 공개시스템 (아파트 매매, 아파트 전월세)',
    cond: `계약일 ${ymLabel(state.from)} ~ ${ymLabel(state.to)} · ${regionLabel()} · 단지명 ${state.apt} · 전용 ${pick}㎡`,
    basis: `${dtstr(I.at)} 수집 · 계약일 기준 · 이 단지의 가장 최근 계약일 ${latestIso || '—'}`,
    proc: '원본 거래 건을 그대로 사용했고, 해제된 매매 거래만 통계에서 뺐습니다. 전월세 자료에는 해제 거래가 없습니다. 전세는 월세가 없는 계약, 월세는 월세가 있는 계약입니다.',
    months: labels.map((m) => m.slice(2, 4) + '.' + m.slice(5)), starts, daysLast: starts.at(-1),
    dots: [], meds: [], hoga: null, ref: null, unsupported: false,
  };
  // 층 구간별 건수·중간값
  D.floors = {};
  FLOOR_BANDS.forEach((b, i) => {
    const v = rows.filter((t) => bandOf(t) === b), f = { rng: b[1], n: v.length, med: null, dep: null, rent: null };
    if (v.length) { if (tab === 'wolse') { f.dep = med(v); f.rent = d3.median(v, (t) => t.rent); } else f.med = med(v); }
    D.floors['LMH'[i]] = f;
  });
  // 요약 수치
  if (tab === 'sale') {
    const latest = d3.max(rows, (t) => t.date), cut = d3.utcFormat('%Y-%m-%d')(d3.utcMonth.offset(new Date(latest + 'T00:00:00Z'), -3));
    const rec = rows.filter((t) => t.date > cut);
    D.kpi = { n: rows.length, med: med(rows), min: d3.min(rows, (t) => t.price), max: d3.max(rows, (t) => t.price), recent: rec.length ? { med: med(rec), n: rec.length, from: mmdd(cut), to: mmdd(latest) } : null };
  } else if (tab === 'jeonse') {
    const sale = D0.sale.filter((t) => t.area === pick);
    const ratio = (a) => (a.length && sale.length ? (med(a) / med(sale) * 100).toFixed(1) + '%' : null), r = ratio(rows);
    D.kpi = { n: rows.length, med: med(rows), min: d3.min(rows, (t) => t.price), max: d3.max(rows, (t) => t.price),
      newMed: nw.length >= LOW ? med(nw) : null, newN: nw.length, renewMed: rn.length >= LOW ? med(rn) : null, renewN: rn.length,
      ratioRaw: r ? `${r} 전세 ${won(med(rows))} ÷ 매매 ${won(med(sale))}${ratio(nw) ? ' · 신규 계약만 ' + ratio(nw) : ''}` : '' };
  } else {
    D.kpi = { n: rows.length, newN: nw.length, renewN: rn.length, depRange: `${won(d3.min(rows, (t) => t.price))} ~ ${won(d3.max(rows, (t) => t.price))}`, allDep: med(rows), allRent: d3.median(rows, (t) => t.rent) };
  }
  if (tab !== 'sale') { D.legNew = nw.length; D.legRenew = rn.length; }
  // 그래프
  if (tab === 'wolse') {
    const maxP = d3.max(rows, (t) => t.price), maxR = d3.max(rows, (t) => t.rent);
    const sx = niceStep(maxP, [1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000], 6), sy = niceStep(maxR, [5, 10, 20, 25, 50, 100, 200, 500, 1000], 5);
    D.xt = d3.range(0, Math.ceil(maxP / sx) * sx + 1, sx); D.yt = d3.range(0, Math.ceil(maxR / sy) * sy + 1, sy).reverse();
    D.dots = rows.map((t) => ({ k: kOf(t), r: t.gbn === '갱신' ? 1 : 0, x: t.price, y: t.rent }));
    D.warn = '월세는 보증금이 클수록 낮아집니다. 월세 금액만 비교하지 말고, 보증금이 비슷한 거래끼리 비교해 주세요.';
    const bins = [['보증금 5천만원 미만', 0, 5000], ['5천만원 ~ 1억원 미만', 5000, 10000], ['1억원 ~ 2억원 미만', 10000, 20000], ['2억원 이상 (반전세)', 20000, Infinity]];
    D.tiers = bins.map(([lab, lo, hi]) => {
      const v = rows.filter((t) => t.price >= lo && t.price < hi);
      return { lab, n: `${v.length}건`, med: v.length >= LOW ? fmtRent(d3.median(v, (t) => t.rent)) + '만원' : '-', rng: v.length ? `${fmt(d3.min(v, (t) => t.rent))} ~ ${fmt(d3.max(v, (t) => t.rent))}만원` : '-' };
    });
  } else {
    const ys = d3.extent(rows, (t) => t.price / 10000), st = niceStep(ys[1] - ys[0] || 0.1, [0.1, 0.2, 0.5, 1, 2, 5, 10, 20], 6);
    const lo = Math.floor(ys[0] / st + 1e-9) * st, hi = Math.max(Math.ceil(ys[1] / st - 1e-9) * st, lo + st);
    D.ticks = d3.range(Math.round(lo / st), Math.round(hi / st) + 1).map((i) => +(i * st).toFixed(2)).reverse();
    D.dots = rows.map((t) => ({ k: kOf(t), r: t.gbn === '갱신' ? 1 : 0, d: dayOf(t.date), p: t.price / 10000 }));
    // 월별 중간값: 한 달 3건 이상인 달만
    for (const [ym, v] of d3.group(rows, (t) => t.ym)) {
      const mi = mlist.indexOf(ym);
      if (v.length >= 3 && mi >= 0) D.meds.push({ mi, d: starts[mi] + 15, p: med(v) / 10000 });
    }
    D.meds.sort((a, b) => a.d - b.d);
  }
  // 현재 호가와 실거래 비교 (askCard와 같은 기준) — 호가를 입력했으면 hoga, 아니면 최근 6개월 실거래 기준(ref)
  const A = { price: '', rent: '', floor: '', src: '', date: '', ...state.ask[tab] }, wolse = tab === 'wolse', PN = tab === 'sale' ? '거래가' : '보증금';
  const cutM = mlist.length > 6 ? mlist[mlist.length - 6] : mlist[0], rec6 = rows.filter((t) => t.ym >= cutM), recOk = rec6.length >= LOW, use = recOk ? rec6 : rows;
  const mdn = med(use), lo = d3.min(use, (t) => t.price), hi = d3.max(use, (t) => t.price), rm = wolse ? d3.median(use, (t) => t.rent) : null;
  const basis = `같은 단지 · 전용 ${pick}㎡ · ${recOk ? `최근 6개월(${cutM.replace('-', '.')}~)` : `조회 전체 기간(최근 6개월 ${rec6.length}건뿐)`} ${KN} 거래 ${use.length}건`;
  const price = parseFloat(A.price), rent = parseFloat(A.rent), floor = parseInt(A.floor, 10), sgn = (v) => (v >= 0 ? '+' : '−');
  if (!(price > 0)) {
    D.ref = { basis, med: won(mdn), rent: wolse ? fmtRent(rm) + '만원' : '', range: `${won(lo)} ~ ${won(hi)}` };
  } else {
    const diff = price - mdn, hasFloor = floor > 0;
    const sim = [...use].sort((x, y) => (hasFloor ? Math.abs(x.floor - floor) - Math.abs(y.floor - floor) : 0) || (x.date < y.date ? 1 : -1)).slice(0, 8);
    D.hoga = {
      basis, med: won(mdn), range: `${won(lo)} ~ ${won(hi)}`, input: won(price) + (hasFloor ? ` · ${floor}층` : ''), inMoney: won(price), medMoney: won(mdn),
      dsign: diff === 0 ? '' : sgn(diff), dval: diff === 0 ? '0원' : won(Math.abs(diff)), pct: `${sgn(diff)}${(Math.abs(diff / mdn) * 100).toFixed(2)}%`, below: diff < 0,
      pos: `비교 거래 ${use.length}건 중 ${use.filter((t) => t.price < price).length}건보다 높고 ${use.filter((t) => t.price > price).length}건보다 낮음`,
      srcdate: `${A.src.trim() || '출처 미입력'} · ${A.date || '기준일 미입력'}`, hasFloor,
      rentMed: wolse ? fmtRent(rm) + '만원' : '',
      rentLine: wolse && A.rent !== '' && rent >= 0 ? `${sgn(rent - rm)}${fmtRent(Math.abs(rent - rm))}만원 (호가 ${fmt(rent)}만원 / 중간값 ${fmtRent(rm)}만원)` : '',
      head: ['계약일', '층', ...(hasFloor ? ['층 차이'] : []), `${PN}(만원)`, ...(wolse ? ['월세(만원)'] : []), '호가 대비(만원)'],
      rows: sim.map((t) => [t.date, String(t.floor), ...(hasFloor ? [`${t.floor - floor >= 0 ? '+' : ''}${t.floor - floor}`] : []), fmt(t.price), ...(wolse ? [fmt(t.rent)] : []), `${sgn(price - t.price)}${fmt(Math.abs(price - t.price))}`]),
    };
  }
  // 앱 화면의 '8억 원'은 리포트 양식에서 '8억원'으로 쓴다
  const norm = (v) => (typeof v === 'string' ? v.replace(/억 원/g, '억원') : Array.isArray(v) ? v.map(norm) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, norm(x)])) : v);
  return norm(D);
}
